name: LongShot
options:
  bundleIdPrefix: com.longshot
  deploymentTarget:
    iOS: '17.0'
targets:
  LongShot:
    type: application
    platform: iOS
    sources:
      - LongShot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.longshot.scrollcapture
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleDisplayName: LongShot
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: LongShot saves your stitched scrolling screenshots to Photos.
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      gatherCoverageData: false
